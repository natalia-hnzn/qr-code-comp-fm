<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="section-hero center-text">
        <div class="hero">
          <div class="hero-img-box margin-bottom-md">
            <img
              src="images/image-qr-code.png"
              alt="QR Code"
              class="hero-img"
            />
          </div>
          <div class="hero-text-box">
            <p class="hero-text-primary heading-primary margin-bottom-md">
              Improve your front-end skills by building projects
            </p>
            <p class="hero-text-secondary heading-secondary">
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </div>
        </div>
      </section>
      <section class="section-footer center-text">
        <div>
          <p class="footer-text">
            Coded by
            <a
              href="https://www.linkedin.com/in/nataliahnzn/"
              class="footer-link"
              >Natália Heinzen</a
            >.
          </p>
          <p class="footer-text">
            Challenge by
            <a
              href="https://www.frontendmentor.io?ref=challenge"
              target="_blank"
              class="footer-link"
              >Frontend Mentor</a
            >.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
